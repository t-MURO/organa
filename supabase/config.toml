project_id = "organa-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "organa://**",
  "http://localhost:8081/**",
  "http://localhost:4173/**"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "{{ .Token }} is your Organa verification code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "{{ .Token }} is your Organa verification code"
content_path = "./supabase/templates/email-code.html"

[functions.finalize-account-deletions]
verify_jwt = false
