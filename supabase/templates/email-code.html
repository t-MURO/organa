<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Organa verification code</title>
  </head>
  <body style="margin: 0; background: #f2efe7; color: #25322c; font-family: sans-serif">
    <div style="margin: 0 auto; max-width: 520px; padding: 48px 24px">
      <p style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">
        Organa
      </p>
      <h1 style="font-size: 28px; font-weight: 500; margin: 18px 0 12px">
        Your verification code
      </h1>
      <p style="font-size: 16px; line-height: 1.6">
        Enter this code in Organa to continue:
      </p>
      <p
        style="
          background: #ffffff;
          border: 1px solid #d8d4ca;
          border-radius: 16px;
          font-size: 32px;
          letter-spacing: 0.24em;
          margin: 24px 0;
          padding: 22px 24px;
          text-align: center;
        "
      >
        {{ .Token }}
      </p>
      <p style="color: #647068; font-size: 14px; line-height: 1.6">
        This code expires in 15 minutes. If you did not request it, you can
        safely ignore this email.
      </p>
    </div>
  </body>
</html>
